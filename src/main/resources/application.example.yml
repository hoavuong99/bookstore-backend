server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: -replace_me-
    username: -replace_me-
    password: -replace_me-
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
  jackson:
    time-zone: UTC

app:
  payment:
    zalopay:
      endpoint: ${ZALOPAY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/create}
      query-endpoint: ${ZALOPAY_QUERY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/query}
      app-id: ${ZALOPAY_APP_ID:}
      key1: ${ZALOPAY_KEY1:}
      key2: ${ZALOPAY_KEY2:}
      callback-url: ${ZALOPAY_CALLBACK_URL:http://localhost:8080/api/v1/payments/zalopay/callback}
      redirect-url: ${ZALOPAY_REDIRECT_URL:http://localhost:5173/payment-result}
      session-minutes: ${ZALOPAY_SESSION_MINUTES:15}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*}
  jwt:
    secret: -replace_me-
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:120}
  upload-dir: -replace_me-

management:
  endpoints:
    web:
      exposure:
        include: health,info